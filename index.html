<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RxOrbit</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#17211b;font-family:system-ui,-apple-system,sans-serif}
header{height:70px;background:#fff;border-bottom:1px solid #e3e8e4;display:flex;align-items:center;padding:0 24px;font-weight:800;font-size:24px}
main{max-width:1100px;margin:auto;padding:24px}.sub{color:#68736c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
.card{background:#fff;border:1px solid #e1e6e2;border-radius:18px;padding:20px}.metric{font-size:32px;font-weight:800;margin-top:8px}.label{color:#68736c}
h2{margin:0 0 16px}.row{display:flex;justify-content:space-between;padding:15px 0;border-top:1px solid #edf0ed}
.badge{padding:5px 9px;border-radius:99px;background:#e9f2eb;font-size:12px;font-weight:700}
@media(max-width:700px){main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head>
<body><header>RxOrbit</header><main>
<h1>Pharmacy Intelligence</h1><div class="sub">Rebuy opportunities and customer follow-up</div>
<section class="grid">
<div class="card"><div class="label">Opportunities</div><div class="metric">24</div></div>
<div class="card"><div class="label">Customers</div><div class="metric">186</div></div>
<div class="card"><div class="label">Potential Revenue</div><div class="metric">₹42,800</div></div>
</section>
<section class="card"><h2>Priority opportunities</h2>
<div class="row"><span>Customer follow-up</span><span class="badge">Due today</span></div>
<div class="row"><span>Repeat purchase opportunity</span><span class="badge">High</span></div>
<div class="row"><span>Medicine refill reminder</span><span class="badge">Today</span></div>
</section></main></body></html>
