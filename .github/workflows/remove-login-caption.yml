name: Remove login caption

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-caption:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove login caption
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="art-caption"><h2>Smarter pharmacy follow-ups.</h2><p>RxOrbit finds the customers most likely to need a refill and helps your pharmacy follow up at the right time.</p></div>'
          if old in s:
              s = s.replace(old, '')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove login marketing caption"
          git push
      - name: Remove one-time workflow
        run: |
          rm -f .github/workflows/remove-login-caption.yml
          git add .github/workflows/remove-login-caption.yml
          git diff --cached --quiet || git commit -m "Remove one-time caption workflow"
          git push
